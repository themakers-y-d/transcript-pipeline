# Proves the kit on Windows (Git Bash, the way Claude Code runs it there) and proves the Mac
# path did not move. Numbers refer to the verification plan (V1) of the Windows port.
# Nothing here talks to a model or to Google: `claude` is a stub (.github/portability/).
name: portability

on:
  push:
    branches: [windows-port]
    paths:
      - 'scripts/**'
      - 'makers/**'
      - '.gitattributes'
      - '.github/**'
  pull_request:
    paths:
      - 'scripts/**'
      - 'makers/**'
      - '.gitattributes'
      - '.github/**'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Git for Windows defaults (checkout with CRLF), before checkout
        run: git config --global core.autocrlf true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "1. CRLF: every script checks out LF under core.autocrlf=true"
        run: |
          git ls-files --eol scripts .github/portability
          for f in scripts/*.sh scripts/*.py; do
            n=$(tr -cd '\r' < "$f" | wc -c | tr -d ' '); echo "$f  CR bytes: $n"; [ "$n" = 0 ] || exit 1
          done
          bash -n scripts/transcript-uploader.sh && bash -n scripts/transcript-absorber.sh && echo "bash -n: both scripts parse"

      - name: "1. negative control: main (no .gitattributes) checks out CRLF on the same runner"
        run: |
          git worktree add --detach "$RUNNER_TEMP/neg" origin/main
          cd "$RUNNER_TEMP/neg"
          test ! -e .gitattributes
          for f in scripts/*.sh scripts/*.py; do printf '%s  CR bytes: ' "$f"; tr -cd '\r' < "$f" | wc -c; done
          n=$(tr -cd '\r' < scripts/transcript-uploader.sh | wc -c | tr -d ' '); [ "$n" -gt 0 ]
          echo "so the check in the step above fails on main and passes on this branch: .gitattributes is what decides it."
          echo "--- what the CRLF copy does, for the record (informational, not asserted):"
          ( source scripts/config.example.sh > "$RUNNER_TEMP/src.txt" 2>&1; head -3 "$RUNNER_TEMP/src.txt"; printf 'LABEL_PREFIX after source: %q\n' "$LABEL_PREFIX" ) || true
          bash -n scripts/transcript-uploader.sh && echo "bash -n on the CRLF uploader: parses" || echo "bash -n on the CRLF uploader: FAILS"
          printf '%s\n' 'set -u' 'x=1' 'echo "x=[$x]"' | sed 's/$/\r/' > "$RUNNER_TEMP/crlf-probe.sh"
          bash "$RUNNER_TEMP/crlf-probe.sh" 2>&1 | cat -A || true
          sh -c 'echo "sh is: $(command -v sh)"'
          printf 'a\r\n' | awk '{print length($0)}'
          python -c "import sys; print('python reads a CRLF config line as', repr(open('scripts/config.example.sh', newline='').readline()))"

      - name: "2. Python resolution: which interpreters exist, and the uploader's own resolver skips a Store-stub python3"
        run: |
          for c in python3 python py; do printf '%-8s -> ' "$c"; command -v "$c" || echo "(none)"; done
          mkdir -p "$RUNNER_TEMP/fake"
          printf '#!/bin/bash\necho "Python was not found; run without arguments to install from the Microsoft Store." >&2\nexit 49\n' > "$RUNNER_TEMP/fake/python3"
          chmod +x "$RUNNER_TEMP/fake/python3"
          sed -n '/^# --- resolve Python 3 once ---/,/^fi$/p' scripts/transcript-uploader.sh > "$RUNNER_TEMP/resolver.sh"
          test -s "$RUNNER_TEMP/resolver.sh"
          PATH="$(cygpath -u "$RUNNER_TEMP")/fake:$PATH" bash -c 'python3 -c "print(1)"; echo "fake python3 rc=$?"; source "$0"; echo "resolver picked: $PY"; [ -n "$PY" ] && [ "$PY" != python3 ]' "$RUNNER_TEMP/resolver.sh"

      - name: "3. tzdata: without it the title hour is UTC, with it Asia/Jerusalem"
        run: |
          T="$(cygpath -u "$RUNNER_TEMP")"
          python -m venv "$T/venv"; VPY="$T/venv/Scripts/python.exe"
          if "$VPY" -c "import zoneinfo; zoneinfo.ZoneInfo('Asia/Jerusalem')" 2>/dev/null; then
            echo "zoneinfo worked without tzdata on this image"; NO_TZ_FAILS=0
          else
            echo "without tzdata: ZoneInfo('Asia/Jerusalem') raises (expected on Windows)"; NO_TZ_FAILS=1
          fi
          ST="$T/tz"; mkdir -p "$ST"
          printf 'm1\t2026-09-20T07:15:00Z\ttrue\tבדיקת שעון\n' > "$ST/meetings.tsv"
          echo m1 > "$ST/worklist.txt"; echo COMPLETE > "$ST/done-m1.txt"
          "$VPY" -c "print('דובר 1: שורה של דיבור רצוף בפגישה\n' * 40)" > "$ST/body-m1-p001.txt"
          "$VPY" scripts/build-parts.py "$ST" 24000 600 Asia/Jerusalem; cut -f3 "$ST/upload-manifest.tsv"
          if [ "$NO_TZ_FAILS" = 1 ]; then grep -q "07:15 |" "$ST/upload-manifest.tsv"; fi
          "$VPY" -m pip install -q tzdata
          "$VPY" -c "import zoneinfo; print('with tzdata:', zoneinfo.ZoneInfo('Asia/Jerusalem'))"
          "$VPY" scripts/build-parts.py "$ST" 24000 600 Asia/Jerusalem; cut -f3 "$ST/upload-manifest.tsv"
          grep -q "10:15 |" "$ST/upload-manifest.tsv"
          [ "$(tr -cd '\r' < "$ST/upload-manifest.tsv" | wc -c | tr -d ' ')" = 0 ] && echo "manifest written with LF"

      - name: "3b. The Windows blocks of INSTALL.md, run exactly as written (a Mac runs the same blocks as no-ops)"
        run: |
          T="$(cygpath -u "$RUNNER_TEMP")/blocks"
          python .github/portability/runbook-blocks.py INSTALL.md "$T"
          for f in "$T"/block*.sh; do
            case "$(cat "$f")" in *schedule.ps1*|*transcript-pipeline/scripts*) continue ;; esac
            echo "--- $(basename "$f"):"; cat "$f"; echo "--- output:"
            bash "$f" 2>&1 | tee "$f.out"
          done
          grep -h "Asia/Jerusalem" "$T"/block*.out
          grep -hiE '^[a-z]:/.*python' "$T"/block*.out

      - name: tzdata for the Python the pipeline will use (what the install runbook does)
        run: python -m pip install --user -q tzdata

      - name: "5. Command-line limit: what a native exe accepts from Git Bash, in ASCII and in Hebrew"
        run: |
          probe() {
            local ch="$1" lo=1000 hi=70000 mid s
            while [ $((hi - lo)) -gt 100 ]; do
              mid=$(((lo + hi) / 2))
              s="$(python -c "import sys; sys.stdout.write(sys.argv[1] * int(sys.argv[2]))" "$ch" "$mid")"
              if python -c "pass" "$s" 2>/dev/null; then lo=$mid; else hi=$mid; fi
            done
            echo "one argument of '$ch' x N: accepted up to about N=$lo"
          }
          probe a
          probe א
          H40="$(python -c "print('א' * 40000, end='')")"
          if python -c "import sys; print(len(sys.argv[1]))" "$H40" 2> "$RUNNER_TEMP/e2big.txt"; then
            echo "40000 Hebrew characters were accepted"; exit 1
          fi
          echo "40000 Hebrew characters: refused: $(head -c 200 "$RUNNER_TEMP/e2big.txt")"
          echo "and through stdin, 40000 is no problem:"
          printf '%s' "$H40" | python -c "import sys; print(len(sys.stdin.read()))"

      - name: "4 (+2). Full uploader and absorber runs with a stub claude, a Store-stub python3 first on PATH, from a folder with a space and Hebrew in its name"
        run: SUITE_FAKE_PY3=1 bash .github/portability/stub-suite.sh . "$(cygpath -u "$RUNNER_TEMP")/תיקייה עם רווח/suite"

      - name: "7. Task Scheduler: install, status, run through the scheduler, uninstall"
        run: |
          rm -f "$(cygpath -u "$RUNNER_TEMP")/תיקייה עם רווח/suite/stub/fixtures/absorb-failed-1"
          bash .github/portability/scheduler-check.sh "$(cygpath -u "$RUNNER_TEMP")/תיקייה עם רווח/suite/vault" com.portability.transcript

      - name: "8. apply-to-vault.py on a fixture MAKERS vault (LF kept, .gitattributes and schedule.ps1 land)"
        run: bash .github/portability/apply-check.sh "$(cygpath -u "$RUNNER_TEMP")/apply"

      - name: "5. negative control: the same suite at 24000 characters a part fails its long upload"
        run: |
          T="$(cygpath -u "$RUNNER_TEMP")/suite24k"
          if CHUNK_CHAR_LIMIT=24000 bash .github/portability/stub-suite.sh . "$T" > "$RUNNER_TEMP/suite24k.txt" 2>&1; then
            cat "$RUNNER_TEMP/suite24k.txt"; echo "the 24000 run passed, so the limit was not hit"; exit 1
          fi
          grep -E "INFO|U1 exits" "$RUNNER_TEMP/suite24k.txt"
          grep "UPLOAD FAILED" "$T/out/U1.log" | head -2
          cat "$T"/out/U1-staging-logs/log-upload-part-m-long-01-*.txt
          [ "$(tr -d '\r\n' < "$T/out/U1.rc")" = 5 ]

      - name: keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-suite-out
          path: |
            ${{ runner.temp }}/תיקייה עם רווח/suite/out
            ${{ runner.temp }}/apply
          if-no-files-found: ignore

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: "1. LF scripts and bash -n"
        run: |
          for f in scripts/*.sh scripts/*.py; do n=$(tr -cd '\r' < "$f" | wc -c | tr -d ' '); echo "$f  CR bytes: $n"; [ "$n" = 0 ] || exit 1; done
          bash -n scripts/transcript-uploader.sh && bash -n scripts/transcript-absorber.sh && echo "bash -n: both scripts parse"

      - name: "Mac: every Windows-guarded runbook block is a no-op here"
        run: |
          python3 .github/portability/runbook-blocks.py INSTALL.md "$RUNNER_TEMP/blocks"
          for f in "$RUNNER_TEMP"/blocks/block*.sh; do out="$(bash "$f" 2>&1)"; echo "$(basename "$f"): [$out]"; [ -z "$out" ]; done

      - name: "4. Full uploader and absorber runs with a stub claude"
        run: bash .github/portability/stub-suite.sh . "$RUNNER_TEMP/תיקייה עם רווח/suite"

      - name: "8. apply-to-vault.py on a fixture MAKERS vault"
        run: bash .github/portability/apply-check.sh "$RUNNER_TEMP/apply"
